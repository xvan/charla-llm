<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  Final Hidden State (Vector h_last from Stage 2)
                        │
                        ▼
       ┌─────────────────────────────────┐
       │ 1. Unembedding (LM Head Matrix) │  ── Converts vector (4096) to Logits (128k)
       └─────────────────────────────────┘
                        │
                        ▼
       ┌─────────────────────────────────┐
       │ 2. Softmax                      │  ── Converts Logits into Probabilities (0 to 1)
       └─────────────────────────────────┘
                        │
                        ▼
       ┌─────────────────────────────────┐
       │ 3. Sampling Strategies          │  ── Applies Temperature, Top-p, Top-k
       └─────────────────────────────────┘
                        │
                        ▼
               Selected Token ID
                        │
                        ├─────────────────────────────┐
                        ▼                             ▼
              Converted to Text Word          Appended back to Prompt
               (Appears on Screen)            (Fed back into Stage 1)

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" lang="en-US">
<h1 id="ciclo-autorregresivo">Ciclo Autorregresivo:</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Paso 1: &quot;Hoy arranco la dieta pero vi unas&quot;                     --&gt; Genera: &quot; facturas&quot;
Paso 2: &quot;Hoy arranco la dieta pero vi unas facturas&quot;            --&gt; Genera: &quot; y&quot;
Paso 3: &quot;Hoy arranco la dieta pero vi unas facturas y&quot;          --&gt; Genera: &quot; ya&quot;
Paso 4: &quot;Hoy arranco la dieta pero vi unas facturas y ya&quot;       --&gt; Genera: &quot; fue&quot;
Paso 5: &quot;Hoy arranco la dieta pero vi unas facturas y ya fue&quot;   --&gt; Genera: &quot; .&quot;
Paso 6: &quot;Hoy arranco la dieta pero vi unas facturas y ya fue .&quot; --&gt; Genera: &quot;&lt;EOS&gt;&quot;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" lang="en-US">
<h3 id="1-context-context-window">1. Context (Context Window)</h3>
<p><strong>What it is</strong><br />
The maximum number of tokens the model can “see” and process in a single request (prompt + conversation history + documents).</p>
<p>1 token ≈ ¾ of an English word, so 1M tokens ≈ 750,000 words.</p>
<table>
<thead>
<tr>
<th>Type</th>
<th>Typical / Flagship numbers</th>
<th>Examples</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Closed</strong></td>
<td><strong>1M – 1.05M</strong> (standard for frontier)</td>
<td>GPT-6 Astra/Sol/Luna: <strong>1.05M</strong><br />Claude Fable 5.1 / Opus 5.5: <strong>1M</strong><br />Gemini 3.x: <strong>~1–1.05M</strong></td>
</tr>
<tr>
<td><strong>Open</strong></td>
<td><strong>128k – 10M</strong> (wide range)</td>
<td>Llama 4 Scout: <strong>10M</strong><br />Llama 4 Maverick: <strong>1M</strong><br />DeepSeek-V3/V4, Qwen3: <strong>128k–1M</strong></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" lang="en-US">
<h3 id="2-cache-prompt--prefix-caching">2. Cache (Prompt / Prefix Caching)</h3>
<p><strong>What it is</strong><br />
A cost- and latency-saving feature. The provider stores the processed version of the <strong>static beginning</strong> of your prompt (system instructions, tools, long documents). Later requests that start with the same prefix only pay a discounted rate for the cached part.</p>
<ul>
<li>Typical discount on cached tokens: <strong>90% off</strong> (OpenAI GPT-6, Anthropic, Gemini) or 50–75% on older models.</li>
<li>Minimum size to cache: usually 1,024+ tokens.</li>
<li>Lifetime: 5–30 minutes (sometimes longer).</li>
<li>Closed models have the most mature, automatic or easy-to-use caching.</li>
<li>Open models rely on the inference engine (vLLM, TensorRT-LLM, etc.) for KV-cache reuse; there is usually no “90% cheaper” API-style discount.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" lang="en-US">
<h3 id="3-par%C3%A1meteros">3. Parámeteros</h3>
<ul>
<li><strong>Dense models</strong>: all parameters are used for every token.</li>
<li><strong>MoE (Mixture-of-Experts)</strong>: only a fraction (“active”) are used per token.</li>
</ul>
<table>
<thead>
<tr>
<th>Type</th>
<th>Typical numbers (2026)</th>
<th>Examples</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Closed</strong></td>
<td><strong>Not published</strong> (rumored low-trillions total for flagships)</td>
<td>GPT-6 Astra, Claude Fable 5.1, Gemini 3.x — OpenAI/Anthropic/Google do not disclose exact counts</td>
</tr>
<tr>
<td><strong>Open</strong></td>
<td><strong>Clearly published</strong></td>
<td>Llama 4 Scout: <strong>109B total / 17B active</strong><br />Llama 4 Maverick: <strong>~400B total / 17B active</strong><br />DeepSeek-V3: <strong>671B total / 37B active</strong><br />Qwen3 dense: 0.6B–32B; MoE variants larger</td>
</tr>
</tbody>
</table>
</section>

<h2 id="corrector-autom%C3%A1tico">Corrector automático</h2>
<p>Requisitos:</p>
<ul>
<li data-marpit-fragment="1">Enunciado.</li>
<li data-marpit-fragment="2">Solución de Referencia.</li>
<li data-marpit-fragment="3">Carpeta con las entregas de los alumnos.</li>

</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" lang="en-US">
<h3 id="1-analizador-inicial-upfront-analysis">1. Analizador Inicial (Upfront Analysis)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">PROMPT_ANALISIS = <span class="hljs-string">f&quot;&quot;&quot;
Basándote en la siguiente información de la materia:

=== ENUNCIADO (<span class="hljs-subst">{filename_statement}</span>) ===
<span class="hljs-subst">{statement_text}</span>

=== SOLUCIÓN DE REFERENCIA (<span class="hljs-subst">{filename_reference}</span>) ===
<span class="hljs-subst">{reference_text}</span>

=== RÚBRICA DE EVALUACIÓN ===
<span class="hljs-subst">{rubric_text}</span>

Genera una guía de corrección sintetizada que contenga:
1. LISTA DE INCISOS/REQUERIMIENTOS: Puntos obligatorios a resolver.
2. MÉTRICAS Y RESULTADOS DE REFERENCIA: Valores esperados (accuracy, MSE, etc.).
3. DETALLES TÉCNICOS CRÍTICOS: Métodos clave y estabilidad numérica.
&quot;&quot;&quot;</span>

response = Settings.llm.complete(PROMPT_ANALISIS)
assignment_summary = <span class="hljs-built_in">str</span>(response)

</code></pre>
</section>

<div>

<li>

</li>

<ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">grade_submission</span>(<span class="hljs-params">student_path: Path, system_prompt: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-built_in">str</span>:
    student_text = load_notebook(student_path)

    <span class="hljs-comment"># La estructura ChatMessage se mapea directamente al payload /api/chat</span>
    messages = [
        ChatMessage(
            role=MessageRole.SYSTEM, 
            content=system_prompt
        ),
        ChatMessage(
            role=MessageRole.USER,
            content=(
                <span class="hljs-string">f&quot;ENTREGA DEL ESTUDIANTE ARCHIVO: <span class="hljs-subst">{student_path.name}</span>\n\n&quot;</span>
                <span class="hljs-string">f&quot;--- INICIO NOTEBOOK ---\n<span class="hljs-subst">{student_text}</span>\n&quot;</span>
                <span class="hljs-string">f&quot;--- FIN NOTEBOOK ---&quot;</span>
            )
        )
    ]

    response = Settings.llm.chat(messages)
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">str</span>(response.message.content)

<h3 id="resumen">RESUMEN</h3>
